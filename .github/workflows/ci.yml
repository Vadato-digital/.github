name: CI

# Vérification du dépôt .github lui-même (fichiers communautaires et modèles de workflow).
# Le job s'appelle "verification" : requis par la règle "main protegee".

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verification:
    name: verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Installation de gitleaks (version épinglée, somme de contrôle vérifiée)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o /tmp/gitleaks.tgz "$url"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          mkdir -p /tmp/gitleaks && tar -xzf /tmp/gitleaks.tgz -C /tmp/gitleaks
          sudo install -m 0755 /tmp/gitleaks/gitleaks /usr/local/bin/gitleaks

      - name: Scan des secrets
        run: gitleaks git --no-banner --redact

      - name: Validité des fichiers YAML et JSON
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || pip install -q pyyaml
          for f in $(git ls-files '*.yml' '*.yaml'); do python3 -c "import sys,yaml; yaml.safe_load(open('$f'))" && echo "ok $f"; done
          for f in $(git ls-files '*.json'); do python3 -c "import json; json.load(open('$f'))" && echo "ok $f"; done
